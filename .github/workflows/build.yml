name: Build Xperable Windows & Linux

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev cmake build-essential pkg-config mingw-w64 wget p7zip-full

      - name: Extract LinuxLoader
        run: |
          git clone https://github.com/LittlenineEnnea/Dump_Qcom_ABL.git /tmp/Dump_Qcom_ABL
          python3 /tmp/Dump_Qcom_ABL/extractfv.py abl_so51a.elf -e all -o ./extracted
          cp ./extracted/extracted_0.efi ./LinuxLoader-so51a.pe

      - name: Compile Linux Binary
        run: |
          make clean || true
          make

      - name: Setup libusb for Windows
        run: |
          wget https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.7z
          7z x libusb-1.0.27.7z
          mkdir -p libusb-static
          cp MinGW64/static/libusb-1.0.a libusb-static/
          cp -r MinGW64/include/* .

      - name: Compile Windows Executable
        run: |
          make clean || true
          make CROSS_BUILD=win

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xperable-binaries
          path: |
            xperable
            xperable.exe
